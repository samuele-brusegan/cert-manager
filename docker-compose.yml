services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/data
      # Permette di leggere i container della rete del reverse proxy dal Docker Engine,
      # tramite il proxy filtrante dockerproxy (solo GET /networks/*).
      - DOCKER_NETWORK=${PROXY_NETWORK:-reverse-proxy}
      - DOCKER_HOST=tcp://dockerproxy:2375

      # URL pubblico opzionale, usato negli script di trust per il download del cert root.
      # - PUBLIC_URL=https://certs.example.com

      # Flag Secure del cookie (servito dietro HTTPS via NPM).
      - COOKIE_SECURE=true

      # Durata sessione idle in ore (default 8).
      # - SESSION_TTL_HOURS=8
      # Origini cross-origin extra ammesse per l'API (virgola-separate). Di default solo same-origin.
      # - CORS_ORIGIN=https://app.example.com
      # Rate limit login/setup: max tentativi e finestra in minuti (default 10 / 10).
      # - AUTH_RATE_LIMIT_MAX=10
      # - AUTH_RATE_LIMIT_WINDOW_MIN=10

      # Percorso del file hosts gestito dal backend. Per scrivere sul file hosts
      # REALE dell'host, monta il file (vedi volumes) e punta qui:
      - HOSTS_FILE=/host-etc-hosts
    volumes:
      - cert_data:/data
      # Monta il file hosts dell'host per poterlo modificare dalla UI (lettura/scrittura).
      - /etc/hosts:/host-etc-hosts
    expose:
      - "3001"
    # Permette di raggiungere NPM tramite la porta pubblicata sull'host
    # usando l'URL: http://host.docker.internal:81
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  # Proxy filtrante verso il Docker socket: espone al backend solo la lettura
  # delle reti (GET /networks/*), niente creazione container o altre API.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      - CONTAINERS=0
      - NETWORKS=1
      - INFO=0
      - IMAGES=0
      - POST=0
      - ALLOW_RESTARTS=0
      - ALLOW_STOP=0
      - ALLOW_START=0
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8091:80"
    networks:
      - default

volumes:
  cert_data:

networks:
  default: {}
